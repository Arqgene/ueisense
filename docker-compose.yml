version: '3.9'

# ═══════════════════════════════════════════════════════════════════════════════
# Uveisense AI — Clinical Ophthalmology Diagnosis Platform
# Arqgene × Dr. Agarwal's Eye Hospital
#
# Services:
#   1. frontend   — Vite/React SPA served via Nginx (port 80)
#   2. api        — Node.js Express REST API + SQLite (port 3001)
#   3. ml-backend — Python FastAPI / PyTorch inference (port 8000)
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ─── Python ML Backend (Neuro-Fuzzy + CNN / Grad-CAM) ──────────────────────
  ml-backend:
    build:
      context: .
      dockerfile: Dockerfile.ml
    image: ueisense/ml-backend:latest
    container_name: ueisense_ml_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend:ro
    environment:
      - MODEL_PATH=/app/backend/models/best_model.pth
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - ueisense_net

  # ─── Node Express API + SQLite DB ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ueisense/api:latest
    container_name: ueisense_api
    ports:
      - "3001:3001"
    volumes:
      - sqlite_data:/app/server/db
      - uploads_data:/app/server/uploads
    environment:
      - PORT=3001
      - PYTHON_BACKEND_URL=http://ml-backend:8000/predict
      - PYTHON_IMAGE_URL=http://ml-backend:8000/predict-image
      - NODE_ENV=production
    depends_on:
      ml-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - ueisense_net

  # ─── React Frontend (Nginx static) ────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ueisense/frontend:latest
    container_name: ueisense_frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ueisense_net

# ─── Persistent Volumes ────────────────────────────────────────────────────
volumes:
  sqlite_data:
    driver: local
  uploads_data:
    driver: local
  ml_models:
    driver: local

# ─── Internal Network ──────────────────────────────────────────────────────
networks:
  ueisense_net:
    driver: bridge
